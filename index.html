<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lap Dash</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div id="top">
      <div id="lapbox">
        <button id="pause" type="button" aria-label="Pause"><i></i><i></i><span>PAUSE</span></button>
        <div id="lapwrap"><span id="laplbl">LAP</span><span id="lap">1/3</span></div>
      </div>
      <div id="lifebox"><span>HEALTH</span><div id="life"><i id="hpfill"></i></div></div>
      <div id="panel">
        <div id="posbig"><b id="posn">4</b><span id="posof">/4</span></div>
        <ol id="rows"></ol>
      </div>
    </div>
    <div id="light" class="off" aria-hidden="true"><div class="lamp"></div><div class="lamp"></div><div class="lamp"><span>GO</span></div></div>
    <div id="ctrlL" class="cluster"></div>
    <div id="ctrlR" class="cluster"></div>
  </div>

  <div id="menu" class="screen">
    <div class="mwrap">
      <div class="head">
        <canvas id="logo" width="280" height="110" aria-hidden="true"></canvas>
        <h1>LAP DASH</h1>
      </div>
      <div class="grid" id="grid">
        <div class="field"><label class="fl" for="name">DRIVER NAME</label><input id="name" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" value="PLAYER"></div>
      </div>
      <button id="go" class="big" type="button">START RACE</button>
    </div>
  </div>

  <div id="rotate" class="screen" hidden>
    <div class="stack">
      <div id="phone" aria-hidden="true"></div>
      <h2>TURN YOUR PHONE</h2>
      <p class="lead" id="rotmsg">HOLD IT SIDEWAYS (LANDSCAPE) TO PLAY.</p>
    </div>
  </div>

  <div id="pausescr" class="screen dim" hidden>
    <div class="stack">
      <h2>PAUSED</h2>
      <button id="resume" class="big" type="button">RESUME</button>
      <button id="restart1" class="big alt" type="button">RESTART</button>
      <button id="tomenu1" class="big alt" type="button">MENU</button>
    </div>
  </div>

  <div id="endscr" class="screen dim" hidden>
    <div class="stack">
      <h2 id="endt">FINISHED</h2>
      <p class="lead" id="ends"></p>
      <button id="again" class="big" type="button">RACE AGAIN</button>
      <button id="tomenu2" class="big alt" type="button">MENU</button>
    </div>
  </div>
</div>
<script src="src/engine/math.js"></script>
<script src="src/engine/track.js"></script>
<script src="src/engine/car.js"></script>
<script src="src/engine/race.js"></script>
<script src="src/ui/options.js"></script>
<script src="src/ui/audio.js"></script>
<script src="src/ui/sprites.js"></script>
<script src="src/ui/renderer.js"></script>
<script src="src/ui/viewport.js"></script>
<script src="src/ui/controls.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/menu.js"></script>
<script src="src/ui/demo.js"></script>
<script src="src/game.js"></script>
</body>
</html>
