<script>
/* Small math helpers shared by the engine and the UI. */
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/** Smallest signed difference between two angles (radians). */
const angDiff=(a,b)=>{let d=(b-a)%TAU; if(d>PI)d-=TAU; if(d<-PI)d+=TAU; return d;};

/**
 * A closed race track.
 * Each track is a list of waypoints (clockwise on screen, first leg = start straight heading east) with a corner radius
 * per waypoint. Corners are rounded into arcs, so the road is a list of straight (L) and arc (A) segments.
 * Positions on the road are (s, d): s = distance along the centreline, d = sideways offset (positive = right of travel).
 * The number of NPC racers picks the track: 3 = easy, 5 = moderate, 7 = hard.
 */
class Track{
  static TW=136;       // road width
  static EDGE=5;       // edge line thickness
  static FIN=330;      // finish line position along the road
  static DEFS={
    3:{name:'EASY',     // plain rounded rectangle, wide gentle corners
       pts:[[-310,-130],[310,-130],[310,130],[-310,130]], rad:[90,90,90,90]},
    5:{name:'MODERATE', // rounded rectangle with an S-bend on the bottom straight
       pts:[[-310,-130],[310,-130],[310,130],[130,130],[70,60],[-30,60],[-90,130],[-310,130]], rad:[80,80,80,70,70,70,70,80]},
    7:{name:'HARD',     // rounded rectangle with two deep, tight U-shaped bays cut into the bottom
       pts:[[-410,-150],[410,-150],[410,150],[255,150],[255,20],[75,20],[75,150],[-75,150],[-75,20],[-255,20],[-255,150],[-410,150]],
       rad:[80,80,80,60,60,60,60,60,60,60,60,75]}
  };
  static AI_OF={3:'easy',5:'normal',7:'hard'};
  static IDS=[3,5,7];

  /** kx stretches the circuit sideways (>=1) so it can fill a wide screen; corner radii stay the same. */
  constructor(id,kx=1){
    const def=Track.DEFS[id]; if(!def) throw new Error('unknown track '+id);
    this.id=id; this.kx=kx; this.name=def.name; this.TW=Track.TW; this.EDGE=Track.EDGE; this.FIN=Track.FIN;
    const n=def.pts.length, P=def.pts.map(p=>({x:p[0]*kx,y:p[1]}));
    const dir=[], ln=[];
    for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy); dir.push({x:dx/l,y:dy/l}); ln.push(l);}
    const F=[];
    for(let i=0;i<n;i++){
      const din=dir[(i+n-1)%n], dout=dir[i];
      const th=Math.atan2(din.x*dout.y-din.y*dout.x, din.x*dout.x+din.y*dout.y);
      if(Math.abs(th)<1e-4){F.push({t:0}); continue;}
      let r=def.rad[i], t=r*Math.tan(Math.abs(th)/2);
      const cap=.49*Math.min(ln[(i+n-1)%n],ln[i]);
      if(t>cap){t=cap; r=t/Math.tan(Math.abs(th)/2);}
      const A={x:P[i].x-din.x*t,y:P[i].y-din.y*t}, B={x:P[i].x+dout.x*t,y:P[i].y+dout.y*t}, sg=Math.sign(th);
      const C={x:A.x-sg*din.y*r,y:A.y+sg*din.x*r};
      F.push({t,r,th,sg,A,B,C,a0:Math.atan2(A.y-C.y,A.x-C.x)});
    }
    const segs=[]; let s=0;
    for(let i=0;i<n;i++){
      const f=F[i], j=(i+1)%n, g=F[j];
      const x0=f.t?f.B.x:P[i].x, y0=f.t?f.B.y:P[i].y, x1=g.t?g.A.x:P[j].x, y1=g.t?g.A.y:P[j].y;
      const l=Math.hypot(x1-x0,y1-y0), a=Math.atan2(dir[i].y,dir[i].x);
      segs.push({k:'L',s0:s,len:l,x0,y0,a,co:Math.cos(a),si:Math.sin(a)}); s+=l;
      if(g.t){const al=g.r*Math.abs(g.th); segs.push({k:'A',s0:s,len:al,cx:g.C.x,cy:g.C.y,r:g.r,a0:g.a0,sg:g.sg,ang:Math.abs(g.th)}); s+=al;}
    }

    for(let u=0;u<s;u+=4){const p=this.pointAt(u,0); x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y);}
    const pad=this.TW/2+this.EDGE/2+8;
    this.pad=pad; this.bx=(x0+x1)/2; this.by=(y0+y1)/2; this.bw=x1-x0+2*pad; this.bh=y1-y0+2*pad;
  }

  /** A track stretched sideways so its bounding box matches an aspect ratio `want` (width/height), capped at 1.9x. */
  static fitted(id,want){
    const t1=new Track(id,1), w0=t1.bw-2*t1.pad;
    return new Track(id,clamp((want*t1.bh-2*t1.pad)/w0,1,1.9));
  }

  wrap(s){return ((s%this.L)+this.L)%this.L;}
  segAt(s){
    s=this.wrap(s);
    for(let i=this.segs.length-1;i>=0;i--) if(s>=this.segs[i].s0) return [this.segs[i],s-this.segs[i].s0];

  }
  /** World position and heading at road coordinates (s, d). */
  pointAt(s,d){
    const [g,u]=this.segAt(s); let x,y,a;

  }

  project(x,y){
    let best=1e18,bs=0,bd=0;
    for(const g of this.segs){
      let u,px,py,a;
      if(g.k==='L'){u=clamp((x-g.x0)*g.co+(y-g.y0)*g.si,0,g.len); px=g.x0+g.co*u; py=g.y0+g.si*u; a=g.a;}
      else{

        if(rel<=g.ang) u=rel*g.r; else u=(rel<(g.ang+TAU)/2)?g.len:0;
        const ff=g.a0+g.sg*u/g.r; px=g.cx+g.r*Math.cos(ff); py=g.cy+g.r*Math.sin(ff); a=ff+g.sg*PI/2;

  }

  minRadAhead(s,D){
    let m=1e9;
    for(const g of this.segs){
      if(g.k!=='A'||g.r>=m) continue;

  gridSlot(i){const row=i>>1,col=i&1; return {s:this.FIN-52-row*68-(col?34:0), d:col?26:-26};}
}

/** Physics constants shared by the cars. */
const CarSpec={VMAX:165, ACC:110, BRK:260, DRAG:45, TURN:2.0, R:12, OFF:12, HP_MAX:100,

/** A car on a track. Position (x,y,a) is in world space; (s,d) is its place on the road; q is the distance raced (all laps). */
class Car{

    Object.assign(this,{
      me,slot,name,sf,track,
      x:pt.x,y:pt.y,a:pt.a,v:0,s:track.wrap(g.s),d:g.d,q:g.s-track.FIN,
      fin:false,finIdx:-1,dead:false,deadT:0,inv:0,hp:CarSpec.HP_MAX,hurtT:0,auto:false,lapN:0,lapMin:1,
      lane:g.d,curD:g.d,laneT:2+Math.random()*3,errT:0,errD:0

  /** The four circles that make up a car's body, used for collisions. */
  static collides(a,b){

    for(const i of [-o,o]) for(const j of [-o,o]){

  }

  /** Advance this car one step. */
  step(race,inp,dt){ if(this.me&&!this.auto) this.stepManual(inp,dt); else this.stepAI(race,dt); }

  stepManual(inp,dt){

    if(inp.brake) this.v-=k.BRK*dt;
    this.v-=Math.abs(steer)*this.v*.75*dt;
    this.v=clamp(this.v,0,k.VMAX);
    this.a+=steer*k.TURN*Math.min(1,this.v/45)*(1-.3*this.v/k.VMAX)*dt;
    this.x+=Math.cos(this.a)*this.v*dt; this.y+=Math.sin(this.a)*this.v*dt;
  }

  stepAI(race,dt){
    const k=CarSpec, tr=race.track, df=race.df;
    let tgt=this.lane, vcap=k.VMAX*this.sf;
    this.laneT-=dt; if(this.laneT<=0){this.lane=(Math.random()*2-1)*38; this.laneT=3+Math.random()*5;}
    this.errT-=dt;
    if(this.errT<=0&&Math.random()<df.err*dt){this.errT=.7; this.errD=(Math.random()<.5?-1:1)*44;}
    if(this.errT>0){vcap*=.62; tgt=this.errD;}
    const rr=tr.minRadAhead(this.s,45+this.v*.8);       // brake for tight corners coming up
    if(rr<1e8) vcap=Math.min(vcap,Math.max(55,rr*1.75));
    for(const o of race.cars){
      if(o===this||o.dead) continue;
      if(o.me&&o.v<k.STOP_V) continue;   // a stopped player is not avoided: the NPCs keep going and run into them
      let ds=o.s-this.s; if(ds<-tr.L/2)ds+=tr.L; else if(ds>tr.L/2)ds-=tr.L;
      if(ds>-56&&ds<=0&&Math.abs(o.d-this.d)<40){   // someone alongside: hold the line, no lane swerve
        this.laneT=Math.max(this.laneT,.4); tgt=this.curD; if(this.errT>0) this.errT=0;
      }
      if(ds>0&&ds<120*df.aware){
        const dd=o.d-this.d;
        if(Math.abs(dd)<38){
          const nd=clamp(this.d+(dd>0?-1:1)*44,-46,46);
          tgt=nd;
          if(Math.abs(nd-o.d)<36||ds<56) vcap=Math.min(vcap,o.v*.96);
        }
      }
    }
    this.curD+=(tgt-this.curD)*Math.min(1,3*dt);
    const pt=tr.pointAt(this.s+k.LOOK0+this.v*k.LOOK1,this.curD);
    const diff=angDiff(this.a,Math.atan2(pt.y-this.y,pt.x-this.x));
    this.a+=clamp(diff*4,-3,3)*dt;
    const vt=vcap*(1-Math.min(.12,Math.abs(diff)*.4));
    this.v+=clamp(vt-this.v,-k.BRK*dt,k.ACC*.85*dt);
    this.x+=Math.cos(this.a)*this.v*dt; this.y+=Math.sin(this.a)*this.v*dt;
  }

  /** Keep the car on the road (walls slow it and, for the player, cost health) and update its (s,d,q). */
  followRoad(race,dt){
    if(this.dead) return;
    const tr=race.track; let pr=tr.project(this.x,this.y); const lim=tr.TW/2-15;
    if(Math.abs(pr.d)>lim){
      if(this.me&&!this.auto&&this.v>25) race.hurt(this,2+this.v*.06);   // scraping or hitting the wall costs health
      const pt=tr.pointAt(pr.s,Math.sign(pr.d)*lim);
      this.x=pt.x; this.y=pt.y; this.v*=Math.pow(.1,dt);
      this.a+=angDiff(this.a,pt.a)*Math.min(1,5*dt);
      pr=tr.project(this.x,this.y);
    }
    let ds=pr.s-this.s; if(ds<-tr.L/2)ds+=tr.L; else if(ds>tr.L/2)ds-=tr.L;
    this.q+=ds; this.s=pr.s; this.d=pr.d;
  }

  /** Back on the road in the very same spot, facing the same way, with full health and a short spell of safety. */
  respawn(){this.hp=CarSpec.HP_MAX; this.v=0; this.dead=false; this.inv=2.2; this.hurtT=0;}
}

/** A pixel-art explosion: chunky cells plus flying debris. Purely visual; the renderer steps it at 14 frames a second. */
class Explosion{
  static DURATION=1.1;
  constructor(x,y){
    this.x=x; this.y=y; this.t=0; this.deb=[];
    for(let i=0;i<16;i++) this.deb.push({a:Math.round(Math.random()*8)*PI/4+(i%2?PI/8:0),v:50+Math.random()*80,big:Math.random()<.5});
    this.seed=Math.floor(Math.random()*1e6);
  }
  update(dt){this.t+=dt;}
  get done(){return this.t>=Explosion.DURATION;}
}

/** Opponent strength per track: speed range (share of top speed), mistake rate and how far ahead they look. */
const DIFFS={
  easy:  {lo:.66,hi:.78,err:.30,aware:.75},
  normal:{lo:.48,hi:.60,err:.10,aware:1},
  hard:  {lo:.44,hi:.56,err:.02,aware:1.15}
};
const NAMES=['ACE','ZAP','REX','JET','MAX','RAY','VIC'];

/**
 * One race: a track, the cars (racers NPCs + the player in the last grid slot), the rules and the clock.
 * state: 'countdown' -> 'racing' -> 'ending' (player finished) -> 'over'.
 * `events` collects what happened this step ('go','lap','bump','crash','finish') for the UI to turn into sound.
 */
class Race{
  static LAPS=3;
  constructor(track,{name='PLAYER',racers=3}={}){
    this.track=track; this.laps=Race.LAPS; this.racers=racers;
    this.df=DIFFS[Track.AI_OF[racers]]||DIFFS.normal;
    const total=racers+1; this.cars=[]; let ai=0;
    for(let i=0;i<total;i++){
      const me=(i===total-1);
      const car=new Car(track,i,{me,name:me?name:NAMES[ai],sf:1});
      if(!me){ai++; car.sf=this.df.lo+Math.random()*(this.df.hi-this.df.lo);}
      this.cars.push(car);
    }
    this.me=this.cars[total-1];
    Object.assign(this,{state:'countdown',cd:3.6,goT:0,t:0,fx:[],finOrder:[],endT:0,result:null,events:[],order:[],rank:total});
    this.refresh();
  }
  /** Leader first. */
  ranks(){return this.cars.slice().sort((a,b)=>(b.fin?1e6-b.finIdx:b.q)-(a.fin?1e6-a.finIdx:a.q));}
  refresh(){this.order=this.ranks(); this.rank=this.order.indexOf(this.me)+1;}
  overlapping(car){for(const o of this.cars) if(o!==car&&Car.collides(car,o)) return true; return false;}

  crash(car){
    car.dead=true; car.deadT=1.1; car.hp=0; car.v=0;
    this.fx.push(new Explosion(car.x,car.y)); this.events.push('crash');
  }
  /** Health lost on a bump; the car blows up when it runs out. A short cooldown stops contact draining health every frame. */
  hurt(car,amt){
    if(car.dead||car.inv>0||car.hurtT>0) return;
    car.hurtT=.5; car.hp=Math.max(0,car.hp-amt);
    if(car.hp<=0) this.crash(car); else this.events.push('bump');
  }

  step(inp,dt){
    if(this.state==='countdown'){
      this.cd-=dt; if(this.cd>0) return;
      this.state='racing'; this.goT=.9; this.events.push('go');
    }
    this.t+=dt; this.goT=Math.max(0,this.goT-dt);
    for(const c of this.cars){c.step(this,inp,dt); c.followRoad(this,dt);}
    const me=this.me; me.hurtT=Math.max(0,me.hurtT-dt);
    if(me.inv>0){
      me.inv-=dt; if(me.inv<=0&&this.overlapping(me)) me.inv=.12;   // stay safe until the spot is clear
    }else if(!me.dead&&!me.auto&&this.state==='racing'){
      for(const o of this.cars) if(o!==me&&Car.collides(me,o)){
        const rvx=Math.cos(me.a)*me.v-Math.cos(o.a)*o.v, rvy=Math.sin(me.a)*me.v-Math.sin(o.a)*o.v;
        this.hurt(me,6+Math.hypot(rvx,rvy)*.10); me.v*=.7; break;
      }
    }
    const L=this.track.L, ln=Math.max(0,Math.floor(me.q/L));
    if(ln>me.lapN){me.lapN=ln; if(ln<this.laps) this.events.push('lap');}
    for(const c of this.cars){
      if(!c.fin&&c.q>=this.laps*L){
        c.fin=true; c.finIdx=this.finOrder.length; this.finOrder.push(c);
        if(c.me){c.auto=true; c.sf=.72; c.lane=0; c.laneT=99; c.curD=c.d; this.state='ending'; this.result='finished'; this.endT=1.4; this.events.push('finish');}
      }
    }
    for(const f of this.fx) f.update(dt);
    this.fx=this.fx.filter(f=>!f.done);
    this.refresh();
    if(this.state==='ending'){this.endT-=dt; if(this.endT<=0) this.state='over';}
  }
}

/** The player's settings (name + three choices), saved on the device. */
class Options{
  static KEY='lapdash.v1';
  static FIELDS=[
    {key:'racers',label:'NPC RACERS',vals:[['3','3'],['5','5'],['7','7']]},
    {key:'hand',label:'CONTROLS',vals:[['std','STANDARD'],['swap','SWAPPED']]},
    {key:'snd',label:'SOUND',vals:[['on','ON'],['off','OFF']]}
  ];
  static DEFAULTS={name:'PLAYER',racers:'3',hand:'std',snd:'on'};
  /** Upper-case, letters/digits/space . - _ only, at most 8 characters, never empty. */
  static cleanName(v){return (String(v||'').toUpperCase().replace(/[^A-Z0-9 .\-_]/g,'').trim().slice(0,8))||'PLAYER';}
  /** 1 -> 1ST, 2 -> 2ND, 3 -> 3RD, 4 -> 4TH, 11 -> 11TH ... */
  static ord(n){return n+['TH','ST','ND','RD'][(n%100>=11&&n%100<=13)?0:(n%10<4?n%10:0)];}

  constructor(storage){
    this.storage=storage; Object.assign(this,Options.DEFAULTS);
    try{
      const s=JSON.parse(storage.getItem(Options.KEY)||'{}');
      if(typeof s.name==='string') this.name=Options.cleanName(s.name);
      for(const f of Options.FIELDS) if(typeof s[f.key]==='string'&&f.vals.some(v=>v[0]===s[f.key])) this[f.key]=s[f.key];
    }catch(e){}
  }
  set(k,v){this[k]=v; this.save();}
  save(){
    try{this.storage.setItem(Options.KEY,JSON.stringify({ver:3,name:this.name,racers:this.racers,hand:this.hand,snd:this.snd}));}catch(e){}
  }
  get racerCount(){return +this.racers;}
}

/** All sound: square-wave beeps, engine/pedal blips and a 1-bit arcade explosion. One fixed master volume. */
class AudioManager{
  static LOUD=3.2;   // one fixed master volume for every sound; nothing ramps or changes it
  constructor(opts){this.opts=opts; this.ac=null;}
  get enabled(){return this.opts.snd==='on';}
  /** The AudioContext, created on first use and resumed if the phone suspended it. */
  context(){
    try{
      if(!this.ac){
        const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
        this.ac=new AC(); const g=this.ac.createGain(); g.gain.value=AudioManager.LOUD; g.connect(this.ac.destination); this.ac.out=g;
      }
      if(this.ac.state==='suspended') this.ac.resume();
    }catch(e){}
    return this.ac;
  }
  /** Phones keep audio locked until a touch: play a silent sound inside the first gesture. Wired up once. */
  installUnlock(){
    const EV=['touchend','pointerup','keydown','click'];
    const un=()=>{
      const a=this.context(); if(!a) return;
      try{const b=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=b; s.connect(a.out); s.start(0);}catch(e){}
      for(const ev of EV) removeEventListener(ev,un,true);
    };
    for(const ev of EV) addEventListener(ev,un,true);
  }
  // Wait for the context to be running before scheduling any sound, so the first tap is heard too.
  _run(fn){
    if(!this.enabled) return; const a=this.context(); if(!a) return;
    if(a.state==='running') fn(a); else a.resume().then(()=>fn(a)).catch(()=>{});
  }
  beep(f,d,type,vol){
    this._run(a=>{try{
      const o=a.createOscillator(), g=a.createGain(), t=a.currentTime; vol=vol||.05;
      o.type=type||'square'; o.frequency.value=f; o.connect(g); g.connect(a.out);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02);
    }catch(e){}});
  }
  rev(f0,f1,d,vol,lp){
    this._run(a=>{try{
      const t=a.currentTime, o=a.createOscillator(), f=a.createBiquadFilter(), g=a.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+d);
      f.type='lowpass'; f.frequency.value=lp||900;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.02,d/3)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(f); f.connect(g); g.connect(a.out); o.start(t); o.stop(t+d+.03);
    }catch(e){}});
  }
  squeal(d,vol){
    this._run(a=>{try{
      const n=Math.floor(a.sampleRate*d), buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0);
      for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
      const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime;
      f.type='bandpass'; f.Q.value=6; f.frequency.setValueAtTime(2200,t); f.frequency.exponentialRampToValueAtTime(1100,t+d);
      g.gain.value=vol; s.buffer=buf; s.connect(f); f.connect(g); g.connect(a.out); s.start(t);
    }catch(e){}});
  }
  /** Button sounds: 'gas' | 'brake' | 'steer' | 'start' | anything else = menu tap. */
  sfx(k){
    if(k==='gas') this.rev(85,190,.16,.07,1100);
    else if(k==='brake'){this.squeal(.11,.09); this.rev(120,70,.09,.04,500);}
    else if(k==='steer') this.beep(520,.025,'square',.025);
    else if(k==='start'){this.rev(70,300,.38,.09,1400); setTimeout(()=>this.rev(150,330,.2,.06,1400),260);}
    else this.rev(110,230,.09,.06,1000);
  }
  boom(){
    this._run(a=>{try{
      // crunchy 1-bit noise: the noise rate falls over time and the volume drops in coarse steps, like an old arcade chip
      const n=Math.floor(a.sampleRate*.8), buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0);
      let val=1;
      for(let i=0;i<n;i++){
        const t=i/n, hold=Math.max(1,Math.floor(3+t*t*90));
        if(i%hold===0) val=Math.random()<.5?-1:1;
        ch[i]=val*Math.round(Math.pow(1-t,1.5)*7)/7;
      }
      const s=a.createBufferSource(), g=a.createGain(); g.gain.value=.15; s.buffer=buf; s.connect(g); g.connect(a.out); s.start();
      const o=a.createOscillator(), og=a.createGain(), t0=a.currentTime;
      o.type='square'; o.frequency.setValueAtTime(170,t0); o.frequency.exponentialRampToValueAtTime(28,t0+.42);
      og.gain.setValueAtTime(.09,t0); og.gain.exponentialRampToValueAtTime(.0001,t0+.48);
      o.connect(og); og.connect(a.out); o.start(t0); o.stop(t0+.5);
    }catch(e){}});
  }
  /** Turn a race event ('crash','bump','go','lap','finish') into its sound. */
  play(e){
    if(e==='crash') this.boom();
    else if(e==='bump') this.beep(120,.09,'square',.12);
    else if(e==='go') this.beep(880,.4);
    else if(e==='lap'){this.beep(660,.12); setTimeout(()=>this.beep(990,.15),130);}
    else if(e==='finish'){this.beep(660,.15); setTimeout(()=>this.beep(880,.15),160); setTimeout(()=>this.beep(1180,.3),320);}
  }
}

/** Pixel-art car sprites: 15x9 pixels, nose pointing right, baked at 8 headings so turning steps like an old arcade game. */
class SpriteSheet{
  static ART=[
    '..###....###...',
    '#####....###..#',
    '#########.....#',
    '#####oo########',
    '######o########',
    '#####oo########',
    '#########.....#',
    '#####....###..#',
    '..###....###...'
  ];
  static W=15; static H=9; static SIZE=21; static ANGLES=8; static PX=3.5;
  static hollow(src){
    const {W,H}=SpriteSheet, at=(r,c)=>r>=0&&r<H&&c>=0&&c<W&&src[r][c]!=='.';
    return src.map((row,r)=>[...row].map((ch,c)=>(ch==='#'&&at(r-1,c)&&at(r+1,c)&&at(r,c-1)&&at(r,c+1))?'o':ch).join(''));
  }
  static bake(src){
    const {W,H,SIZE:SS,ANGLES}=SpriteSheet, out=[];
    for(let k=0;k<ANGLES;k++){
      const th=k*TAU/ANGLES, co=Math.cos(th), si=Math.sin(th);
      const cvs=document.createElement('canvas'); cvs.width=cvs.height=SS;
      const c=cvs.getContext('2d'), img=c.createImageData(SS,SS);
      for(let y=0;y<SS;y++) for(let x=0;x<SS;x++){
        const dx=x+.5-SS/2, dy=y+.5-SS/2;
        const sx=Math.floor(dx*co+dy*si+W/2), sy=Math.floor(-dx*si+dy*co+H/2);
        if(sx<0||sy<0||sx>=W||sy>=H) continue;
        const ch=src[sy][sx]; if(ch==='.') continue;
        const i=(y*SS+x)*4, v=ch==='#'?255:0;
        img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;
      }
      c.putImageData(img,0,0); out.push(cvs);
    }
    return out;
  }
  constructor(){this.player=SpriteSheet.bake(SpriteSheet.ART); this.rival=SpriteSheet.bake(SpriteSheet.hollow(SpriteSheet.ART));}
  /** Draw a car centred on (x,y) heading `a`; `solid` = the player's white car, otherwise an outlined rival. U = pixel size. */
  draw(c,x,y,a,solid,U){
    const {SIZE,ANGLES,PX}=SpriteSheet; U=U||PX;
    const k=((Math.round(a/(TAU/ANGLES))%ANGLES)+ANGLES)%ANGLES, sz=SIZE*U;
    c.imageSmoothingEnabled=false;
    c.drawImage((solid?this.player:this.rival)[k],x-sz/2,y-sz/2,sz,sz);
  }
}

/** Draws a race (or the demo) on the canvas: black ground, road, start boxes, finish line, cars and explosions. */
class Renderer{
  static EXP_P=7;          // size of one explosion cell
  static EXP_FPS=14;       // explosions step at 14 frames a second
  constructor(canvas,sprites){this.cv=canvas; this.ctx=canvas.getContext('2d'); this.sprites=sprites; this.dpr=1; this.paths=new WeakMap();}
  resize(w,h){this.dpr=Math.min(2,window.devicePixelRatio||1); this.cv.width=Math.round(w*this.dpr); this.cv.height=Math.round(h*this.dpr);}
  pathOf(t){
    let p=this.paths.get(t); if(p) return p;
    p=new Path2D(); const g0=t.segs[0]; p.moveTo(g0.x0,g0.y0);
    for(const g of t.segs){
      if(g.k==='L') p.lineTo(g.x0+g.co*g.len,g.y0+g.si*g.len);
      else p.arc(g.cx,g.cy,g.r,g.a0,g.a0+g.sg*g.ang,g.sg<0);
    }
    p.closePath(); this.paths.set(t,p); return p;
  }
  drawTrack(t,total){
    const c=this.ctx, P=this.pathOf(t), W=t.TW;
    c.lineJoin='round'; c.lineCap='butt'; c.setLineDash([]);
    c.strokeStyle='#fff'; c.lineWidth=W+t.EDGE; c.stroke(P);                 // road edge lines: wide white, narrower black on top
    c.strokeStyle='#000'; c.lineWidth=W-t.EDGE; c.stroke(P);
    c.strokeStyle='#fff'; c.setLineDash([12,12]); c.lineWidth=W-t.EDGE; c.stroke(P);   // dashed rails just inside the edges
    c.setLineDash([]); c.strokeStyle='#000'; c.lineWidth=W-t.EDGE-16; c.stroke(P);
    c.strokeStyle='#777'; c.lineWidth=2.5; c.setLineDash([16,22]); c.stroke(P); c.setLineDash([]);   // centre line
    c.strokeStyle='#555'; c.lineWidth=1.5;                                    // start grid boxes
    for(let k=0;k<total;k++){const g=t.gridSlot(k), p=t.pointAt(g.s,g.d); c.save(); c.translate(p.x,p.y); c.rotate(p.a); c.strokeRect(-34,-20,68,40); c.restore();}
    const f=t.pointAt(t.FIN,0), q=W/12;                                       // checkered finish line
    c.save(); c.translate(f.x,f.y); c.rotate(f.a); c.fillStyle='#fff';
    for(let row=0;row<12;row++) for(let col=0;col<2;col++) if((row+col)%2===0) c.fillRect(-q+col*q,-W/2+row*q,q,q);
    c.restore();
  }
  /** Pixel explosion: chunky square cells on a fixed grid. */
  drawExplosion(f){
    const c=this.ctx, fr=Math.floor(f.t*Renderer.EXP_FPS); if(fr>=15) return;
    const P=Renderer.EXP_P;
    const hs=(a,b,k)=>{let h=Math.imul(a+101,73856093)^Math.imul(b+101,19349663)^Math.imul(k+7,83492791)^f.seed; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)%100;};
    c.save(); c.translate(f.x,f.y); c.fillStyle='#fff';
    const cell=(gx,gy,s)=>c.fillRect(gx*P-s/2,gy*P-s/2,s,s);
    if(fr<3){
      const rad=[2.2,3.4,4.4][fr];
      for(let gy=-5;gy<=5;gy++) for(let gx=-5;gx<=5;gx++) if(gx*gx+gy*gy<=rad*rad) cell(gx,gy,P);
    }else if(fr<11){
      const rad=3.6+(fr-3)*.9, keep=100-(fr-3)*9;
      for(let gy=-11;gy<=11;gy++) for(let gx=-11;gx<=11;gx++){
        const dd=Math.hypot(gx,gy);
        if(Math.abs(dd-rad)<=1.1&&hs(gx,gy,fr)<keep) cell(gx,gy,P);
        else if(fr<6&&dd<=2.1&&hs(gx,gy,fr+50)<70) cell(gx,gy,P);
      }
    }
    f.deb.forEach((d,i)=>{
      if(fr>=13||(fr>=9&&hs(i,0,fr)>=55)) return;
      const gx=Math.round(Math.cos(d.a)*d.v*f.t/P), gy=Math.round(Math.sin(d.a)*d.v*f.t/P);
      cell(gx,gy,(d.big&&fr<8)?P:P*.55);
    });
    c.restore();
  }
  /** One frame. `race` may be null (black screen). vb = {cx,cy,sc}: where the track's centre goes and how big it is. */
  render(w,h,race,vb){
    const c=this.ctx; c.setTransform(this.dpr,0,0,this.dpr,0,0); c.fillStyle='#000'; c.fillRect(0,0,w,h);
    if(!race) return;
    const t=race.track; c.translate(vb.cx,vb.cy); c.scale(vb.sc,vb.sc); c.translate(-t.bx,-t.by);
    this.drawTrack(t,race.cars.length);
    const me=race.me;
    for(const k of race.cars) if(!k.me) this.sprites.draw(c,k.x,k.y,k.a,false);
    if(!me.dead&&!(me.inv>0&&Math.floor(race.t*10)%2===0)) this.sprites.draw(c,me.x,me.y,me.a,true);
    for(const f of race.fx) this.drawExplosion(f);
  }
}

/** Works out where the track goes on screen: the free area under the top bar, clear of the stoplight. Landscape only. */
class Viewport{
  constructor(app,{hud,top,light}){this.app=app; this.hud=hud; this.top=top; this.light=light; this.vb={cx:0,cy:0,sc:1};}
  get width(){return this.app.clientWidth;}
  get height(){return this.app.clientHeight;}
  get isLandscape(){return this.width>=this.height;}
  box(){
    const w=this.width, h=this.height, hudOn=!this.hud.hidden, appTop=this.app.getBoundingClientRect().top;
    const top=hudOn?this.top.getBoundingClientRect().bottom-appTop+4:10, bot=hudOn?0:10;
    const left=hudOn?this.light.offsetWidth+26:0;
    return {w,h,top,bot,left,aw:w-left,ah:h-top-bot};
  }
  /** Build the chosen track for this screen: stretched sideways when the screen is wider than the track. */
  fit(id){const A=this.box(); return Track.fitted(id,A.aw/A.ah);}
  compute(track){
    const A=this.box(); if(!A.w||!A.h) return this.vb;
    this.vb={cx:A.left+A.aw/2,cy:A.top+A.ah/2,sc:Math.min(A.aw/track.bw,A.ah/track.bh)}; return this.vb;
  }
}

/**
 * The four on-screen buttons (< > BRK GAS) plus the keyboard.
 * Touch works like a real pedal pad: every finger is tracked on its own, and sliding a finger from one button
 * to the next hands the press over (the first lets go, the next is pressed). Lifting the finger or sliding off the pad releases.
 */
class Controls{
  static KEYS={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake'};
  static NAMES=['left','right','brake','gas'];
  constructor(clusterL,clusterR,{onPress}={}){
    this.clusters=[clusterL,clusterR]; this.onPress=onPress||(()=>{});
    this.touch={left:false,right:false,gas:false,brake:false}; this.kb={...this.touch}; this.state={...this.touch};
    this.ptrs=new Map();   // pointerId -> {cluster, key}
    this.btns={}; this.hand='std';
    for(const [k,label] of [['left','<'],['right','>'],['brake','BRK'],['gas','GAS']]){
      const b=document.createElement('button'); b.className='tb'; b.type='button'; b.textContent=label; b.setAttribute('aria-label',k);
      b.addEventListener('contextmenu',e=>e.preventDefault()); this.btns[k]=b;
    }
    for(const cl of this.clusters){
      cl.addEventListener('pointerdown',e=>this._down(e,cl));
      cl.addEventListener('pointermove',e=>this._move(e,cl));
      for(const t of ['pointerup','pointercancel','lostpointercapture']) cl.addEventListener(t,e=>this._up(e));
      cl.addEventListener('contextmenu',e=>e.preventDefault());
    }
    this.layout('std');
  }
  /** Put steering on the left and pedals on the right (STANDARD) or the other way round (SWAPPED). */
  layout(hand){
    this.hand=hand; const b=this.btns, steer=[b.left,b.right], ped=[b.brake,b.gas];
    this.clusters[0].replaceChildren(...(hand==='swap'?ped:steer));
    this.clusters[1].replaceChildren(...(hand==='swap'?steer:ped));
  }
  _keyAt(cl,x,y){
    const R=cl.getBoundingClientRect(), m=24;
    if(x<R.left-m||x>R.right+m||y<R.top-m||y>R.bottom+m) return null;
    let best=null,bd=1e9;
    for(const b of cl.children){
      const r=b.getBoundingClientRect(), dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom), d=dx*dx+dy*dy;
      if(d<bd){bd=d; best=b.getAttribute('aria-label');}
    }
    return best;
  }
  _down(e,cl){
    e.preventDefault(); try{cl.setPointerCapture(e.pointerId);}catch(_){}
    this._set(e.pointerId,cl,this._keyAt(cl,e.clientX,e.clientY));
  }
  _move(e,cl){ if(this.ptrs.has(e.pointerId)) this._set(e.pointerId,cl,this._keyAt(cl,e.clientX,e.clientY)); }
  _up(e){ if(this.ptrs.delete(e.pointerId)) this._refresh(); }
  _set(id,cl,key){
    const prev=this.ptrs.get(id); if(prev&&prev.key===key) return;
    this.ptrs.set(id,{cl,key}); this._refresh();
    if(key) this.onPress(key);
  }
  _refresh(){
    for(const k of Controls.NAMES) this.touch[k]=false;
    for(const {key} of this.ptrs.values()) if(key) this.touch[key]=true;
    this._paint();
  }
  _paint(){for(const k of Controls.NAMES) this.btns[k].classList.toggle('on',this.touch[k]||this.kb[k]);}
  keyDown(key){const k=Controls.KEYS[key]; if(k){this.kb[k]=true; this._paint(); return true;} return false;}
  keyUp(key){const k=Controls.KEYS[key]; if(k){this.kb[k]=false; this._paint();}}
  /** The combined input for this frame. */
  read(){for(const k of Controls.NAMES) this.state[k]=this.touch[k]||this.kb[k]; return this.state;}
  /** Let go of everything (pause, menu, rotate). */
  clear(){this.ptrs.clear(); for(const k of Controls.NAMES){this.touch[k]=false; this.kb[k]=false;} this._paint();}
}

/** The on-screen display during a race: pause + lap, health bar, position and leaderboard, stoplight. */
class Hud{
  constructor(root,audio){
    const $=s=>root.querySelector(s);
    this.root=root; this.audio=audio; this.top=$('#top'); this.light=$('#light'); this.lamps=[...this.light.children];
    this.lapEl=$('#lap'); this.lifeEl=$('#life'); this.fill=$('#hpfill'); this.posn=$('#posn'); this.posof=$('#posof'); this.rows=$('#rows'); this.pauseBtn=$('#pause');
    this.reset();
  }
  get hidden(){return this.root.hidden;}
  show(v){this.root.hidden=!v;}
  reset(){this.boardKey=''; this.lastLap=''; this.lastLife=-1; this.lastSig=''; this.lastRank=0;}
  static row(c,i){
    const li=document.createElement('li'); if(c.me) li.className='me'; li.title=c.name;
    const b=document.createElement('b'); b.textContent=String(i+1); const s=document.createElement('span'); s.textContent=c.name.slice(0,3);
    li.append(b,s); return li;
  }
  update(r){
    const me=r.me, L=r.track.L;
    const lap=clamp(Math.max(Math.floor(me.q/L)+1,me.lapMin),1,r.laps), txt=lap+'/'+r.laps;
    if(txt!==this.lastLap){this.lastLap=txt; this.lapEl.textContent=txt;}
    const hp=Math.ceil(me.hp);
    if(hp!==this.lastLife){
      if(this.lastLife>hp&&hp>0){this.lifeEl.classList.remove('hit'); void this.lifeEl.offsetWidth; this.lifeEl.classList.add('hit');}
      this.lastLife=hp; this.fill.style.width=hp+'%'; this.lifeEl.classList.toggle('low',hp<=30);
    }
    this.posof.textContent='/'+r.cars.length;
    if(r.rank!==this.lastRank){this.lastRank=r.rank; this.posn.textContent=r.rank;}
    const key=r.order.map(c=>c.name+(c.me?'*':'')).join('|');
    if(key!==this.boardKey){this.boardKey=key; this.rows.replaceChildren(...r.order.map(Hud.row));}
    // stoplight: lamps come on one by one, then the third lamp flashes GO
    let lit=0, go=false;
    if(r.state==='countdown') lit=clamp(4-Math.ceil(r.cd),0,3); else if(r.goT>0) go=true;
    const vis=r.state==='countdown'||go, sig=(vis?'v':'h')+(go?'g':lit);
    if(sig!==this.lastSig){
      this.lastSig=sig; this.light.classList.toggle('off',!vis);
      this.lamps.forEach((l,i)=>l.classList.toggle('on',!go&&lit>i));
      this.lamps[2].classList.toggle('go',go);
      if(lit>0&&!go) this.audio.beep(440,.15);
    }
  }
}

/** The start menu: driver name, NPC racers, controls side, sound, START RACE. */
class Menu{
  constructor(root,opts,{onChange,onStart}){
    this.root=root; this.opts=opts; this.onChange=onChange; this.onStart=onStart;
    this.nameEl=root.querySelector('#name'); this.goBtn=root.querySelector('#go');
    const grid=root.querySelector('#grid');
    for(const f of Options.FIELDS){
      const wrap=document.createElement('div'); wrap.className='field';
      const lab=document.createElement('span'); lab.className='fl'; lab.textContent=f.label; lab.id='l-'+f.key;
      const seg=document.createElement('div'); seg.className='seg'; seg.setAttribute('role','group'); seg.setAttribute('aria-labelledby',lab.id);
      for(const [v,t] of f.vals){
        const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=t; b.dataset.k=f.key; b.dataset.v=v;
        b.onclick=()=>{opts.set(f.key,v); this.sync(); this.onChange(f.key,v);};
        seg.append(b);
      }
      wrap.append(lab,seg); grid.append(wrap);
    }
    this.nameEl.value=opts.name;
    this.nameEl.addEventListener('input',e=>{opts.name=Options.cleanName(e.target.value);});
    this.nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); onStart();}});
    this.goBtn.onclick=()=>onStart();
    this.sync();
  }
  get hidden(){return this.root.hidden;}
  show(v){this.root.hidden=!v; if(v) this.sync();}
  sync(){for(const b of this.root.querySelectorAll('.seg .opt')) b.setAttribute('aria-pressed',String(this.opts[b.dataset.k]===b.dataset.v));}
  /** Read the typed name, clean it, show and save it. */
  commitName(){const n=Options.cleanName(this.nameEl.value); this.nameEl.value=n; this.opts.name=n; this.opts.save(); return n;}
  /** The menu's title picture: three cars between road dashes. */
  drawLogo(canvas,sprites){
    const c=canvas.getContext('2d'); c.fillStyle='#000'; c.fillRect(0,0,280,110);
    c.fillStyle='#fff'; for(let x=0;x<280;x+=28) c.fillRect(x,92,14,4); for(let x=0;x<280;x+=28) c.fillRect(x+14,14,14,4);
    sprites.draw(c,140,54,0,true,3.6); sprites.draw(c,50,54,-.39,false,3.6); sprites.draw(c,230,56,.39,false,3.6);
  }
}

/** The computer-only race that plays behind the menu. */
class Demo{
  constructor(viewport){this.vp=viewport; this.race=null; this.sig='';}
  static autopilot(r){r.me.auto=true; r.me.sf=.85; r.me.hurtT=1e9;}   // the demo "player" drives itself and cannot be hurt
  start(racers){
    const t=this.vp.fit(racers);
    this.race=new Race(t,{name:'YOU',racers}); Demo.autopilot(this.race); this.race.cd=1.2;
    this.sig=this.vp.width+'x'+this.vp.height; this.vp.compute(t);
  }
  /** Picking a different racer count swaps the track under the race without restarting it: every car keeps its place
   *  (same share of the lap, same lane, same speed) on the new road, and any extra cars join at the back of the pack. */
  switchTo(racers){
    const old=this.race;
    if(!old||old.state!=='racing'||old.cars.some(c=>c.fin||c.dead)){this.start(racers); return;}
    const ot=old.track, oldAI=old.cars.filter(c=>!c.me);
    const rel=new Map(old.cars.map(c=>[c,angDiff(ot.pointAt(c.s,0).a,c.a)]));
    const t=this.vp.fit(racers), k=t.L/ot.L, r2=new Race(t,{name:'YOU',racers});
    Demo.autopilot(r2); r2.state='racing'; r2.cd=0; r2.t=old.t;
    let ai=0, rearQ=1e9, vSum=0, vN=0;
    for(const c of r2.cars){
      const src=c.me?old.me:oldAI[ai++]; if(!src) continue;
      c.q=src.q*k; c.s=t.wrap(t.FIN+c.q); c.d=src.d; c.v=src.v; c.lane=src.lane; c.curD=src.curD; c.lapMin=src.lapMin; c.lapN=src.lapN;
      const pt=t.pointAt(c.s,c.d); c.x=pt.x; c.y=pt.y; c.a=pt.a+rel.get(src); c.placed=true;
      rearQ=Math.min(rearQ,c.q); vSum+=c.v; vN++;
    }
    let j=0;
    for(const c of r2.cars) if(!c.placed){
      j++; c.q=rearQ-70*j; c.s=t.wrap(t.FIN+c.q); c.d=j%2?-26:26; c.lane=c.curD=c.d; c.v=vSum/Math.max(1,vN);
      const pt=t.pointAt(c.s,c.d); c.x=pt.x; c.y=pt.y; c.a=pt.a; c.lapMin=Math.max(1,Math.floor(c.q/t.L)+1); c.inv=1;
    }
    r2.refresh(); this.race=r2; this.sig=this.vp.width+'x'+this.vp.height; this.vp.compute(t);
  }
  step(dt,racers){
    if(!this.race) return;
    this.race.step({},dt); this.race.events.length=0;
    if(this.race.state==='over') this.start(racers);
  }
}

/** Lap Dash: wires the objects together and runs the frame loop. Exposed as `window.game`. */
class Game{
  constructor(doc=document){
    const $=s=>doc.querySelector(s);
    this.app=$('#app'); this.cv=$('#cv');
    this.opts=new Options(Game.storage());
    this.audio=new AudioManager(this.opts);
    this.sprites=new SpriteSheet();
    this.renderer=new Renderer(this.cv,this.sprites);
    this.hud=new Hud($('#hud'),this.audio);
    this.viewport=new Viewport(this.app,{hud:this.hud.root,top:this.hud.top,light:this.hud.light});
    this.demo=new Demo(this.viewport);
    this.pausescr=$('#pausescr'); this.endscr=$('#endscr'); this.rotEl=$('#rotate');
    this.race=null; this.paused=false; this.endShown=false; this.last=0;
    this.controls=new Controls($('#ctrlL'),$('#ctrlR'),{onPress:k=>this.audio.sfx(k==='gas'?'gas':k==='brake'?'brake':'steer')});
    this.controls.layout(this.opts.hand);
    this.menu=new Menu($('#menu'),this.opts,{
      onChange:(k,v)=>{ if(k==='hand') this.controls.layout(v); this.layout(); if(k==='racers') this.demo.switchTo(this.opts.racerCount); },
      onStart:()=>this.startRace()
    });
    this.menu.drawLogo($('#logo'),this.sprites);
    $('#again').onclick=$('#restart1').onclick=()=>this.startRace();
    $('#resume').onclick=$('#pause').onclick=()=>this.togglePause();
    $('#tomenu1').onclick=$('#tomenu2').onclick=()=>this.showMenu();
    this.bindEvents(doc);
    this.layout(); this.demo.start(this.opts.racerCount);
    requestAnimationFrame(t=>this.frame(t));
  }
  /** localStorage, or a do-nothing stand-in when the browser blocks it (private mode, cleared site data). */
  static storage(){
    try{const s=window.localStorage; s.getItem('lapdash.v1'); return s;}catch(e){return {getItem:()=>null,setItem:()=>{}};}
  }
  get track(){return (this.race||this.demo.race||{}).track;}
  get inRace(){return !!this.race&&!this.hud.hidden;}

  bindEvents(doc){
    this.audio.installUnlock();
    // menu / screen buttons click: a quick rev (or the start sound for the "go" buttons)
    doc.addEventListener('click',e=>{
      const b=e.target.closest&&e.target.closest('button'); if(!b||b.classList.contains('tb')) return;
      this.audio.sfx(['go','again','restart1','resume'].includes(b.id)?'start':'tap');
    });
    addEventListener('keydown',e=>{
      if(this.inRace&&!this.paused&&this.controls.keyDown(e.key)){e.preventDefault(); return;}
      if((e.key==='p'||e.key==='P'||e.key==='Escape')&&this.inRace&&this.race.state!=='over') this.togglePause();
    });
    addEventListener('keyup',e=>this.controls.keyUp(e.key));
    doc.addEventListener('visibilitychange',()=>{if(doc.hidden&&this.inRace&&!this.paused&&this.race.state!=='over') this.togglePause();});
    new ResizeObserver(()=>this.layout()).observe(this.app);
    addEventListener('resize',()=>this.layout());
    addEventListener('orientationchange',()=>setTimeout(()=>this.layout(),150));
  }

  layout(){
    const vp=this.viewport, w=vp.width, h=vp.height; if(!w||!h) return;
    this.renderer.resize(w,h);
    this.app.dataset.view='h'; this.app.classList.toggle('portrait',h>w);
    if(this.track) vp.compute(this.track);
    if(!this.menu.hidden&&this.demo.race&&this.demo.sig!==w+'x'+h) this.demo.start(this.opts.racerCount);
    this.updateRotate();
  }
  /** Everything is landscape: an upright phone gets a "turn your phone" screen, and a race in progress pauses until it is sideways again. */
  updateRotate(){
    const inRace=this.inRace&&this.race.state!=='over';
    if(this.viewport.isLandscape){this.rotEl.hidden=true; return;}
    if(inRace&&!this.paused){this.paused=true; this.pausescr.hidden=false; this.controls.clear();}
    this.rotEl.querySelector('#rotmsg').textContent=inRace?'THE RACE IS PAUSED. HOLD YOUR PHONE SIDEWAYS (LANDSCAPE) TO CARRY ON.':'HOLD YOUR PHONE SIDEWAYS (LANDSCAPE) TO PLAY.';
    this.rotEl.hidden=false;
  }

  showMenu(){
    this.race=null; this.paused=false; this.controls.clear();
    this.hud.show(false); this.pausescr.hidden=true; this.endscr.hidden=true; this.menu.show(true);
    this.demo.start(this.opts.racerCount);
  }
  startRace(){
    this.menu.commitName(); this.audio.context();
    this.menu.show(false); this.endscr.hidden=true; this.pausescr.hidden=true; this.hud.show(true);
    this.layout();
    const t=this.viewport.fit(this.opts.racerCount);
    this.race=new Race(t,{name:this.opts.name,racers:this.opts.racerCount});
    this.endShown=false; this.paused=false; this.hud.reset(); this.controls.clear(); this.controls.layout(this.opts.hand);
    this.hud.update(this.race); this.layout();
  }
  togglePause(){
    if(!this.inRace) return;
    this.paused=!this.paused; this.pausescr.hidden=!this.paused; this.controls.clear();
  }
  showEnd(){
    this.endShown=true; const r=this.race, n=r.rank;
    this.endscr.querySelector('#endt').textContent=n===1?'YOU WIN!':'FINISHED';
    this.endscr.querySelector('#ends').textContent='YOU TOOK '+Options.ord(n)+' PLACE OF '+r.cars.length+' RACERS.';
    this.endscr.hidden=false;
  }

  /** Advance the game by dt seconds (no drawing). Used by the frame loop and by tests. */
  update(dt){
    if(this.inRace&&!this.paused){
      this.race.step(this.controls.read(),dt);
      for(const e of this.race.events.splice(0)) this.audio.play(e);
      this.hud.update(this.race);
      if(this.race.state==='over'&&!this.endShown) this.showEnd();
    }else if(!this.menu.hidden) this.demo.step(dt,this.opts.racerCount);
  }
  draw(){
    const R=this.inRace?this.race:(!this.menu.hidden?this.demo.race:null);
    this.renderer.render(this.viewport.width,this.viewport.height,R,this.viewport.vb);
  }
  frame(t){
    requestAnimationFrame(t2=>this.frame(t2));
    const dt=Math.min(.033,(t-this.last)/1000||0); this.last=t;
    this.update(dt); this.draw();
  }
}
window.game=new Game();

</script>
</body></html>
